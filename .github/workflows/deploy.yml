# ==============================================================================
# GitHub Actions — Utility Account CI/CD Pipeline
#
# Trigger: push to main branch
#
# Steps:
#   1. Checkout source code
#   2. Set up Java 21
#   3. Cache Maven dependencies (speeds up subsequent builds)
#   4. Run full test suite including Testcontainers integration tests
#   5. Build production JAR (already built by tests, just package)
#   6. Log in to GitHub Container Registry (GHCR)
#   7. Build Docker image
#   8. Push Docker image to GHCR
#   9. Pull new image and restart stack via docker compose
#
# Runner: self-hosted (runs on the Ubuntu server at /opt/payments/)
# Registry: ghcr.io (GitHub Container Registry, free private images)
# ==============================================================================

name: Utility Account CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Test, Dockerize, Deploy
    runs-on: self-hosted

    steps:

      # ------------------------------------------------------------------------
      # Step 1: Checkout
      # ------------------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Step 2: Set up Java 21
      # ------------------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ------------------------------------------------------------------------
      # Step 3: Cache Maven dependencies
      # Cache key includes pom.xml hash — invalidated when dependencies change.
      # ------------------------------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ------------------------------------------------------------------------
      # Step 4 & 5: Run tests and build JAR
      # mvn clean package runs the full lifecycle including Testcontainers
      # integration tests. Docker must be available on the runner — it is,
      # since the runner is the server itself.
      # ------------------------------------------------------------------------
      - name: Run tests and build JAR
        run: mvn clean package

      # ------------------------------------------------------------------------
      # Step 6: Log in to GitHub Container Registry
      # Uses GITHUB_TOKEN — automatically provided by GitHub Actions.
      # ------------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Step 7 & 8: Build and push Docker image
      # Tags the image as both :latest and :<git-sha> for rollback traceability.
      # ------------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/oualidg/utility-account:latest
            ghcr.io/oualidg/utility-account:${{ github.sha }}

      # ------------------------------------------------------------------------
      # Step 9: Deploy to server
      # Pulls the new image and restarts only the utility-account container.
      # --no-deps: avoids restarting nginx or other services unnecessarily.
      # Since the runner IS the server, no SSH is needed.
      # ------------------------------------------------------------------------
      - name: Deploy
        run: |
          cd /opt/payments
          docker compose pull utility-account
          docker compose up -d --no-deps utility-account
          docker image prune -f